name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: build-and-test (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore .\QuotaLens.sln

      - name: Build Windows app
        run: dotnet build .\QuotaLens.csproj -c Release --no-restore --warnaserror

      - name: Build macOS app (compile check)
        run: dotnet build .\src\QuotaLens.Mac\QuotaLens.Mac.csproj -c Release --no-restore --warnaserror

      - name: Run parser checks
        run: dotnet run --project .\tests\QuotaLens.Tests\QuotaLens.Tests.csproj -c Release

  macos:
    name: build-and-test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Check shell scripts for macOS bash 3.2
        # The system bash 3.2, in a UTF-8 locale, reads non-ASCII bytes right after `$name` as part of
        # the variable name, so `$arch）` fails under `set -u`; such variables must be written `${name}`.
        run: |
          for f in install-mac.sh publish-mac.sh Install-QuotaLens.command; do /bin/bash -n "$f"; done
          if perl -ne 'print "$ARGV:$.: $_" if /\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]/; close ARGV if eof' \
              install-mac.sh publish-mac.sh Install-QuotaLens.command | grep .; then
            echo "Write the variables above as \${name}." >&2
            exit 1
          fi

      - name: Build shared core and macOS app
        run: |
          dotnet build src/QuotaLens.Core/QuotaLens.Core.csproj -c Release --warnaserror
          dotnet build src/QuotaLens.Mac/QuotaLens.Mac.csproj -c Release --warnaserror

      - name: Run parser checks
        run: dotnet run --project tests/QuotaLens.Tests/QuotaLens.Tests.csproj -c Release

      - name: Package QuotaLens.app (arm64)
        run: ./publish-mac.sh osx-arm64

      - name: Render previews from the packaged app
        run: |
          open -W -n artifacts/mac/osx-arm64/QuotaLens.app --args --render-preview "$PWD/artifacts/preview"
          ls -la artifacts/preview

      - name: Upload app and previews
        uses: actions/upload-artifact@v4
        with:
          name: quota-lens-macos-arm64
          path: |
            artifacts/QuotaLens-*-macos-arm64.zip
            artifacts/preview/*.png
