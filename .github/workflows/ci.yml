name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore .\QuotaLens.csproj

      - name: Build
        run: dotnet build .\QuotaLens.csproj -c Release --no-restore --warnaserror

      - name: Run parser checks
        run: dotnet run --project .\tests\QuotaLens.Tests\QuotaLens.Tests.csproj -c Release
