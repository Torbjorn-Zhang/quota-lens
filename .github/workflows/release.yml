name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Build self-contained executable
        shell: pwsh
        run: |
          dotnet publish .\QuotaLens.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\dist\app

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path .\dist\app\QuotaLens.exe -DestinationPath ".\QuotaLens-${{ github.ref_name }}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: QuotaLens-*-win-x64.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Build QuotaLens.app for Apple Silicon and Intel
        run: ./publish-mac.sh osx-arm64 osx-x64

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/QuotaLens-*-macos-*.zip

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Hash
        working-directory: dist
        run: sha256sum QuotaLens-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/QuotaLens-*.zip dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --generate-notes \
            --title "Quota Lens ${{ github.ref_name }}"
